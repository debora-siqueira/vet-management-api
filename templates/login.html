{% extends "base.html" %}
{% block content %}
<div class="login card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="VetClin – Clínica Veterinária" class="logo-login">
    <p class="mu" style="text-align:center; margin-bottom:1.25rem">Sistema de Gerenciamento de Clínica Veterinária</p>

    <form id="loginForm" method="POST" action="{{ url_for('login') }}">
        <label for="emailInput">E-mail</label>
        <input type="email" name="email" id="emailInput" required autofocus>

        <label for="senhaInput" style="margin-top:.75rem">Senha</label>
        <input type="password" name="senha" id="senhaInput" required>

        <div style="margin-top:1.25rem">
            <button type="submit" class="b" style="width:100%">Entrar</button>
        </div>
    </form>

</div>
{% endblock %}
